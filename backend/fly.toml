# Fly.io deployment for the Phodex Cloud runtime.
#
#   flyctl launch --no-deploy --copy-config --name phodex-cloud   # first time
#   flyctl secrets set JWT_SECRET_KEY=... SETTINGS_ENCRYPTION_KEY=... \
#       DATABASE_URL=... ALEMBIC_DATABASE_URL=... REDIS_URL=... \
#       ANTHROPIC_API_KEY=... GITHUB_DEFAULT_TOKEN=... \
#       DEMO_ACCOUNT_EMAIL=... DEMO_ACCOUNT_PASSWORD=... GOOGLE_CLIENT_ID=...
#   flyctl deploy
#
# See docs/cloud-runtime.md for the full walkthrough (Neon + Upstash + secrets).

app = "phodex-cloud"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  RUNTIME_MODE = "cloud"
  WORKER_ENGINE = "claude"
  WORKSPACES_ROOT = "/srv/phodex/workspaces"
  CLAUDE_DEFAULT_WORKDIR = "/srv/phodex/workspaces"
  CLAUDE_PERMISSION_MODE = "bypassPermissions"
  CLAUDE_REQUIRE_INITIAL_APPROVAL = "true"
  MAX_CONCURRENT_TASKS_PER_USER = "1"
  MAX_ACTIVE_SESSIONS_PER_USER = "10"
  ALLOW_INSECURE_TEST_TOKENS = "false"
  PUBLIC_BASE_URL = "https://phodex-cloud.fly.dev"
  ALLOWED_ORIGINS = "https://phodex-amber.vercel.app"
  METRICS_ENABLED = "true"
  LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  # Tasks run as subprocesses and SSE streams stay open; never stop the machine
  # underneath them.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health/live"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

# Workspaces are re-cloned automatically if the disk is wiped, so a volume is
# optional. Uncomment to keep clones across deploys (faster task start):
# [mounts]
#   source = "phodex_workspaces"
#   destination = "/srv/phodex/workspaces"
