[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --benchmark-min-rounds=50 --benchmark-sort=mean"

markers = [
    "benchmark: performance benchmarks",
    "load: load tests",
    "slow: slow tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
plugins = []
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = [
    "google.*",
    "jose.*",
    "alembic.*",
    "passlib.*",
    "prometheus_client.*",
    "redis.*",
    "qrcode.*",
]
ignore_missing_imports = true
